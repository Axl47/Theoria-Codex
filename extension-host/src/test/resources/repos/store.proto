syntax = "proto3";
message Store { string name = 1; string badge = 2; string signing_key = 3; Contact contact = 4; ExtensionList extension_list = 101; string extension_list_url = 102; }
message Contact { string website = 1; string discord = 2; }
message ExtensionList { repeated Extension extensions = 1; }
message Extension { string name = 1; string package_name = 2; Resources resources = 3; string extension_lib = 4; int64 version_code = 5; string version_name = 6; int32 content_warning = 7; repeated Source sources = 8; repeated Source anime_sources = 9; }
message Resources { string apk_url = 1; string icon_url = 2; string jar_url = 501; }
message Source { int64 id = 1; string name = 2; string language = 3; string home_url = 4; }

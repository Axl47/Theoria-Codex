services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      LT_LOAD_ONLY: en,ja,zh,ko
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_CHAR_LIMIT: "1000"
      LT_REQ_LIMIT: "60"
      LT_THREADS: "4"
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - dokploy-network

volumes:
  libretranslate-models:

networks:
  dokploy-network:
    external: true

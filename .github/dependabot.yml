version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Puerto_Rico
    open-pull-requests-limit: 5
    ignore:
      # Robolectric dictates this version; it moves only with a Robolectric bump.
      - dependency-name: "org.robolectric:android-all-instrumented"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Puerto_Rico
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Puerto_Rico
    open-pull-requests-limit: 3

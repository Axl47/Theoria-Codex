name: Build personal Debug copy bridge

on:
  workflow_dispatch:
    inputs:
      debug_certificate_sha256:
        description: SHA-256 printed by scripts/copy_production_to_debug.py --print-debug-certificate
        required: true
        type: string

permissions:
  contents: read

jobs:
  personal-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Assemble certificate-pinned personal APK
        env:
          COPY_DEBUG_CERT: ${{ inputs.debug_certificate_sha256 }}
        run: |
          if ! [[ "$COPY_DEBUG_CERT" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Supply exactly one SHA-256 Debug certificate fingerprint"
            exit 1
          fi
          ./gradlew :app:assemblePersonalRelease "-Ptheoria.developerCopyCertSha256=$COPY_DEBUG_CERT"

      - name: Sign personal APK with the existing production key
        id: sign_personal
        env:
          BUILD_TOOLS_VERSION: '36.0.0'
          THEORIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.THEORIA_UPLOAD_KEYSTORE_BASE64 }}
          THEORIA_UPLOAD_KEY_ALIAS: ${{ secrets.THEORIA_UPLOAD_KEY_ALIAS }}
          THEORIA_UPLOAD_STORE_PASSWORD: ${{ secrets.THEORIA_UPLOAD_STORE_PASSWORD }}
          THEORIA_UPLOAD_KEY_PASSWORD: ${{ secrets.THEORIA_UPLOAD_KEY_PASSWORD }}
        run: >-
          python3 scripts/sign_release_apk.py
          app/build/outputs/apk/personalRelease/app-personalRelease-unsigned.apk
          app/build/outputs/apk/personalRelease/app-personalRelease-signed.apk

      - name: Save personal APK as a short-lived developer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: theoria-personal-debug-copy
          path: ${{ steps.sign_personal.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 1

name: Release

# Started by the release skill after the notes are approved. Everything runs side by side, and the
# tag is created only when all of it passes, so a failed release can be fixed and retried as the
# same version. Runs from any other branch are rehearsals: they stop short of publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      notes-file: ${{ steps.gate.outputs.notes-file }}
      verified: ${{ steps.gate.outputs.verified }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check release metadata and find an existing result
        id: gate
        run: python3 scripts/release_gate.py ${{ github.ref != 'refs/heads/main' && '--rehearsal' || '' }}

  verify:
    needs: gate
    if: ${{ needs.gate.outputs.verified != 'true' }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  device-validation:
    needs: gate
    uses: ./.github/workflows/device-validation.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  build-release:
    name: Build signed release APK
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Read-only: this build holds the private link hosts, which must not land in a shared cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Assemble release APK
        env:
          THEORIA_LINK_HOSTS: ${{ secrets.THEORIA_LINK_HOSTS }}
        run: ./gradlew :app:assembleRelease

      - name: Sign release APK
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: '36.0.0'
          THEORIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.THEORIA_UPLOAD_KEYSTORE_BASE64 }}
          THEORIA_UPLOAD_KEY_ALIAS: ${{ secrets.THEORIA_UPLOAD_KEY_ALIAS }}
          THEORIA_UPLOAD_STORE_PASSWORD: ${{ secrets.THEORIA_UPLOAD_STORE_PASSWORD }}
          THEORIA_UPLOAD_KEY_PASSWORD: ${{ secrets.THEORIA_UPLOAD_KEY_PASSWORD }}
        run: >-
          python3 scripts/sign_release_apk.py
          app/build/outputs/apk/release/app-release-unsigned.apk
          app/build/outputs/apk/release/app-release-signed.apk

      - name: Normalize update asset name
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" theoria-codex-main.apk

      # Short retention: an unpublished signed APK should not outlive the release attempt.
      - name: Hand the signed APK to the publish job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-release-apk
          path: theoria-codex-main.apk
          if-no-files-found: error
          retention-days: 1

  # Verify is skipped when this code already passed it; nothing else may be missing.
  publish:
    name: Tag and publish prerelease
    needs: [gate, verify, device-validation, build-release]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
      && needs.device-validation.result == 'success'
      && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7.0.1

      - name: Download signed APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: signed-release-apk

      - name: Create the tag and publish
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.gate.outputs.tag }}
          prerelease: true
          draft: false
          files: theoria-codex-main.apk
          fail_on_unmatched_files: true
          body_path: ${{ needs.gate.outputs.notes-file }}

  # A signed APK that will not be published should not linger for its retention day.
  discard-release-apk:
    name: Discard unpublished APK
    needs: [build-release, publish]
    if: ${{ always() && needs.build-release.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Delete the signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=signed-release-apk" \
            --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

name: Main

# Proves every commit that lands on main, so Release only has to sign and publish it. Runs the host
# check, the release part, the screenshots, and the emulator tests side by side, even when the pre-PR
# check was already recorded, and records each result that passes. It is also the only run that saves caches.
# The run in progress always finishes so its results and caches are saved; a newer push replaces any
# older run still waiting, so only the newest commit queues behind it.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
    with:
      check: true
      release: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  device-validation:
    uses: ./.github/workflows/device-validation.yml
    permissions:
      contents: write
    with:
      record: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

name: Main

# Proves every commit that lands on main, so Release only has to sign and publish it. Runs the host
# check, the release part, the screenshots, and the emulator tests side by side, even when the pre-PR
# check was already recorded, and records each result that passes. It is also the only run that saves caches.
# Main has no concurrency group of its own: verify.yml and device-validation.yml each queue in their own
# never-cancelled group, so a run in progress always finishes and records, a newer push replaces any older
# run still waiting, and the next commit's host check and caches don't wait for the emulator tests.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
    with:
      check: true
      release: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  device-validation:
    uses: ./.github/workflows/device-validation.yml
    permissions:
      contents: write
    with:
      record: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

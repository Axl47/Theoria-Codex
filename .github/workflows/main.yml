name: Main

# Proves every commit that lands on main, so Release only has to sign and publish it. Runs the host
# check, the release part, and the emulator tests side by side, even when the pre-PR check was
# already recorded, and records each result that passes. It is also the only run that saves caches.
# A newer push cancels an older run: only the newest commit on main needs proving.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
    with:
      check: true
      release: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  device-validation:
    uses: ./.github/workflows/device-validation.yml
    permissions:
      contents: write
    with:
      record: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

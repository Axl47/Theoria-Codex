name: Main Prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute release metadata
        run: |
          APP_BUILD_FILE="app/build.gradle.kts"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p' "$APP_BUILD_FILE" | head -n 1)"
          DECLARED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9_]+).*/\1/p' "$APP_BUILD_FILE" | head -n 1 | tr -d '_')"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not resolve versionName from $APP_BUILD_FILE"
            exit 1
          fi
          if [ -z "$DECLARED_VERSION_CODE" ]; then
            echo "Could not resolve versionCode from $APP_BUILD_FILE"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]{1,4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "VERSION_NAME must follow vX.Y.Z-compatible format (without leading v)"
            exit 1
          fi
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION_NAME"
          VERSION_MAJOR=$((10#$VERSION_MAJOR))
          VERSION_MINOR=$((10#$VERSION_MINOR))
          VERSION_PATCH=$((10#$VERSION_PATCH))
          VERSION_CODE_BASE=1500000000
          VERSION_CODE=$((VERSION_CODE_BASE + VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          RELEASE_TITLE="v${VERSION_NAME}"
          RELEASE_TAG="${RELEASE_TITLE}"
          RELEASE_NOTES_FILE="release-notes/${RELEASE_TITLE}.md"

          if [ "${GITHUB_REF_NAME}" != "$RELEASE_TAG" ]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match app version $RELEASE_TAG"
            exit 1
          fi
          # actions/checkout resolves a tag push to its commit and overwrites the
          # local tag ref. Restore the remote tag object before validating it.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "$GITHUB_REF_NAME must be an annotated tag"
            exit 1
          fi
          if [ "$DECLARED_VERSION_CODE" -ne "$VERSION_CODE" ]; then
            echo "versionCode $DECLARED_VERSION_CODE must equal SemVer-derived code $VERSION_CODE"
            exit 1
          fi
          if [ ! -s "$RELEASE_NOTES_FILE" ]; then
            echo "Missing curated release notes: $RELEASE_NOTES_FILE"
            exit 1
          fi
          if [ "$(git tag -l --format='%(contents)' "$RELEASE_TAG")" != "$(cat "$RELEASE_NOTES_FILE")" ]; then
            echo "$RELEASE_TAG annotation must exactly match $RELEASE_NOTES_FILE"
            exit 1
          fi

          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_FILE=${RELEASE_NOTES_FILE}" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: |
          ./gradlew :app:assembleRelease

      - name: Sign release APK
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.THEORIA_UPLOAD_KEYSTORE_BASE64 }}
          alias: ${{ secrets.THEORIA_UPLOAD_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.THEORIA_UPLOAD_STORE_PASSWORD }}
          keyPassword: ${{ secrets.THEORIA_UPLOAD_KEY_PASSWORD }}

      - name: Normalize update asset name
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" theoria-codex-main.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: true
          draft: false
          files: theoria-codex-main.apk
          fail_on_unmatched_files: true
          body_path: ${{ env.RELEASE_NOTES_FILE }}

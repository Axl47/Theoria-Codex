name: Main Prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute release metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_BUILD_FILE="app/build.gradle.kts"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p' "$APP_BUILD_FILE" | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$APP_BUILD_FILE" | head -n 1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not resolve versionName/versionCode from $APP_BUILD_FILE"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]{1,4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "VERSION_NAME must follow vX.Y.Z-compatible format (without leading v)"
            exit 1
          fi
          RELEASE_TITLE="v${VERSION_NAME}"
          RELEASE_TAG="${RELEASE_TITLE}"

          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: |
          ./gradlew :app:assembleRelease \
            -Ptheoria.versionCode=${VERSION_CODE} \
            -Ptheoria.versionName=${VERSION_NAME}

      - name: Sign release APK
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.THEORIA_UPLOAD_KEYSTORE_BASE64 }}
          alias: ${{ secrets.THEORIA_UPLOAD_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.THEORIA_UPLOAD_STORE_PASSWORD }}
          keyPassword: ${{ secrets.THEORIA_UPLOAD_KEY_PASSWORD }}

      - name: Normalize update asset name
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" theoria-codex-main.apk

      - name: Generate sectioned release notes
        run: |
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-creatordate | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            python3 .github/scripts/generate_main_release_notes.py \
              --output main-release-notes.md \
              --channel main \
              --head "${GITHUB_SHA}" \
              --commit "${SHORT_SHA}" \
              --previous-tag "$PREV_TAG"
          else
            python3 .github/scripts/generate_main_release_notes.py \
              --output main-release-notes.md \
              --channel main \
              --head "${GITHUB_SHA}" \
              --commit "${SHORT_SHA}"
          fi

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: true
          draft: false
          files: theoria-codex-main.apk
          fail_on_unmatched_files: true
          body_path: main-release-notes.md

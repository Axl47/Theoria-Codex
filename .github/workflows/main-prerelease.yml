name: Main Prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The release skill tags only a commit whose push-to-main checks are green. Prove that
  # instead of re-running them, and reject a malformed tag before any expensive job starts.
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release-tag: ${{ steps.metadata.outputs.release-tag }}
      release-title: ${{ steps.metadata.outputs.release-title }}
      release-notes-file: ${{ steps.metadata.outputs.release-notes-file }}
      connected-tests: ${{ steps.checks.outputs.connected-tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        run: |
          APP_BUILD_FILE="app/build.gradle.kts"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p' "$APP_BUILD_FILE" | head -n 1)"
          DECLARED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9_]+).*/\1/p' "$APP_BUILD_FILE" | head -n 1 | tr -d '_')"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not resolve versionName from $APP_BUILD_FILE"
            exit 1
          fi
          if [ -z "$DECLARED_VERSION_CODE" ]; then
            echo "Could not resolve versionCode from $APP_BUILD_FILE"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]{1,4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "VERSION_NAME must follow vX.Y.Z-compatible format (without leading v)"
            exit 1
          fi
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION_NAME"
          VERSION_MAJOR=$((10#$VERSION_MAJOR))
          VERSION_MINOR=$((10#$VERSION_MINOR))
          VERSION_PATCH=$((10#$VERSION_PATCH))
          VERSION_CODE_BASE=1500000000
          VERSION_CODE=$((VERSION_CODE_BASE + VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          RELEASE_TITLE="v${VERSION_NAME}"
          RELEASE_TAG="${RELEASE_TITLE}"
          RELEASE_NOTES_FILE="release-notes/${RELEASE_TITLE}.md"

          if [ "${GITHUB_REF_NAME}" != "$RELEASE_TAG" ]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match app version $RELEASE_TAG"
            exit 1
          fi
          # actions/checkout resolves a tag push to its commit and overwrites the
          # local tag ref. Restore the remote tag object before validating it.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "$GITHUB_REF_NAME must be an annotated tag"
            exit 1
          fi
          if [ "$DECLARED_VERSION_CODE" -ne "$VERSION_CODE" ]; then
            echo "versionCode $DECLARED_VERSION_CODE must equal SemVer-derived code $VERSION_CODE"
            exit 1
          fi
          if [ ! -s "$RELEASE_NOTES_FILE" ]; then
            echo "Missing curated release notes: $RELEASE_NOTES_FILE"
            exit 1
          fi
          if [ "$(git tag -l --format='%(contents)' "$RELEASE_TAG")" != "$(cat "$RELEASE_NOTES_FILE")" ]; then
            echo "$RELEASE_TAG annotation must exactly match $RELEASE_NOTES_FILE"
            exit 1
          fi

          {
            echo "release-tag=${RELEASE_TAG}"
            echo "release-title=${RELEASE_TITLE}"
            echo "release-notes-file=${RELEASE_NOTES_FILE}"
          } >> "$GITHUB_OUTPUT"

      # Verify runs on every push to main and must have passed. Device Validation is path-filtered and
      # cancellable, so a missing or cancelled run sends its connected tests to this tag instead.
      - name: Require successful main checks for this exact commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_run() {
            # The newest push-to-main run for this SHA is authoritative; a re-run updates it in place.
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\")]
                    | sort_by(.created_at) | last
                    | if . == null then \"missing\" else \"\(.status)/\(.conclusion) \(.html_url)\" end"
          }
          verify="$(latest_run verify.yml)"
          echo "verify.yml: ${verify}"
          if [[ "$verify" != completed/success\ * ]]; then
            echo "::error::verify.yml has no successful push-to-main run for ${GITHUB_SHA} (${verify})."
            exit 1
          fi
          device="$(latest_run device-validation.yml)"
          echo "device-validation.yml: ${device}"
          case "$device" in
            completed/success\ *) connected=false ;;
            missing|completed/cancelled\ *|completed/skipped\ *)
              echo "::notice::Device Validation did not complete for ${GITHUB_SHA}; this tag runs its connected tests."
              connected=true ;;
            *)
              echo "::error::device-validation.yml did not pass for ${GITHUB_SHA} (${device})."
              exit 1 ;;
          esac
          echo "connected-tests=${connected}" >> "$GITHUB_OUTPUT"

  # R8 acceptance is tag-specific; debug connected tests run here only when main lacks them for this commit.
  release-acceptance:
    needs: preflight
    uses: ./.github/workflows/device-validation.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    with:
      connected-tests: ${{ needs.preflight.outputs.connected-tests == 'true' }}

  # Builds and signs in parallel with acceptance; nothing is published until both succeed.
  build-release:
    name: Build signed release APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Assemble release APK
        run: |
          ./gradlew :app:assembleRelease

      - name: Sign release APK
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: '36.0.0'
          THEORIA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.THEORIA_UPLOAD_KEYSTORE_BASE64 }}
          THEORIA_UPLOAD_KEY_ALIAS: ${{ secrets.THEORIA_UPLOAD_KEY_ALIAS }}
          THEORIA_UPLOAD_STORE_PASSWORD: ${{ secrets.THEORIA_UPLOAD_STORE_PASSWORD }}
          THEORIA_UPLOAD_KEY_PASSWORD: ${{ secrets.THEORIA_UPLOAD_KEY_PASSWORD }}
        run: >-
          python3 scripts/sign_release_apk.py
          app/build/outputs/apk/release/app-release-unsigned.apk
          app/build/outputs/apk/release/app-release-signed.apk

      - name: Normalize update asset name
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" theoria-codex-main.apk

      # Short retention: an unpublished signed APK should not outlive the release attempt.
      - name: Hand the signed APK to the publish job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-release-apk
          path: theoria-codex-main.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish prerelease
    needs: [preflight, release-acceptance, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7.0.1

      - name: Download signed APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: signed-release-apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.release-tag }}
          name: ${{ needs.preflight.outputs.release-title }}
          prerelease: true
          draft: false
          files: theoria-codex-main.apk
          fail_on_unmatched_files: true
          body_path: ${{ needs.preflight.outputs.release-notes-file }}


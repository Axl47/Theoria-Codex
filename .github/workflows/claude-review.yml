name: Claude Design Review

# A second reviewer beside Codex: Claude (Opus) reviews the design of a pull request, not its nits.
# The reviewer's instructions live in .github/claude/design-review.md; edit that file to tune it.
# .github/claude/design_review.py calls the Claude API directly (no Claude Code), giving Claude
# read-only tools to open, list and search files in the pull request. Its final message is the review.
#
# When it runs
# - Once when a pull request opens, or when a draft is marked ready for review. Pushes do not re-run it.
# - Whenever someone with write access (owner, member or collaborator) comments @claude on a pull
#   request, in the conversation or on a line of the diff. Anything after @claude is passed to the
#   reviewer as what to focus on.
# - Never automatically for bot authors (Dependabot and any other [bot]) or for pull requests from
#   forks, which GitHub runs without secrets.
#
# Size limit
# - Automatic reviews skip pull requests over MAX_AUTO_REVIEW_LINES lines changed (additions plus
#   deletions) and post one comment saying so. @claude requests are never size-limited.
# - The default, 5000, would have reviewed 148 of the 160 human pull requests opened in the 30 days to
#   2026-11-21 (92%) and skipped the dozen largest, which drove about a quarter of the estimated cost.
# - To change it without a commit, set a repository variable named CLAUDE_REVIEW_MAX_LINES
#   (Settings > Secrets and variables > Actions > Variables). Otherwise edit the default below.
#
# Which pull requests and how many (cost cap)
# - Automatic reviews run only for pull requests whose title starts with one of the conventional-commit
#   types in CLAUDE_REVIEW_TYPES (default: feat refactor perf), the changes where design matters most.
#   Other types are skipped quietly (a line in the job summary, no comment). Set the variable to * to
#   review every type.
# - At most CLAUDE_REVIEW_DAILY_CAP automatic reviews run per day (default 10), counted from the review
#   comments posted since midnight in America/Puerto_Rico. Once the cap is reached, a pull request gets
#   one comment saying so. @claude requests count toward the day's total but are never refused.
# - Measured 2026-11-22 to 11-26: about $0.53 per review and ~50 pull requests a day, so reviewing
#   everything would cost ~$800 a month. 10 a day comes to at most ~$165 a month.
# - Change either without a commit through repository variables
#   (Settings > Secrets and variables > Actions > Variables).
#
# Setup
# - Add an Anthropic API key as a repository secret named ANTHROPIC_API_KEY
#   (Settings > Secrets and variables > Actions > New repository secret).
#
# Safety
# - The script and the prompt always come from the default branch, never from the pull request, and
#   the pull request's code is only read, never run. Claude's tools cannot leave the pull request's
#   checkout or its .claude-review/ folder, and it has no shell, file writing or web access.
#
# Cost
# - Each run prints a "claude-design-review usage:" line (tokens and estimated USD) in the review step
#   and a usage table in the job summary. On an API error it prints Anthropic's exact error.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

env:
  MAX_AUTO_REVIEW_LINES: ${{ vars.CLAUDE_REVIEW_MAX_LINES || '5000' }}
  AUTO_REVIEW_TYPES: ${{ vars.CLAUDE_REVIEW_TYPES || 'feat refactor perf' }}
  DAILY_REVIEW_CAP: ${{ vars.CLAUDE_REVIEW_DAILY_CAP || '10' }}
  CAP_TIMEZONE: America/Puerto_Rico
  REVIEW_MARKER: '<!-- claude-design-review -->'
  SIZE_SKIP_MARKER: '<!-- claude-design-review:size-skip -->'
  CAP_SKIP_MARKER: '<!-- claude-design-review:cap-skip -->'

jobs:
  decide:
    name: decide
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot'
        && !endsWith(github.event.pull_request.user.login, '[bot]')
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review: ${{ steps.decide.outputs.review }}
      pr: ${{ steps.decide.outputs.pr }}

    steps:
      - name: Decide whether to review
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          TITLE: ${{ github.event.pull_request.title }}
          ADDITIONS: ${{ github.event.pull_request.additions || 0 }}
          DELETIONS: ${{ github.event.pull_request.deletions || 0 }}
        run: |
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" != pull_request ]]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "Reviewing #$PR on request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          type=$(sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p' <<< "$TITLE")
          if [[ "$AUTO_REVIEW_TYPES" != '*' && " $AUTO_REVIEW_TYPES " != *" ${type:-none} "* ]]; then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "#$PR is a '${type:-untyped}' pull request; automatic reviews cover only: $AUTO_REVIEW_TYPES. Comment @claude to request one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          comments=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body')
          if grep -qF "$REVIEW_MARKER" <<< "$comments"; then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "#$PR already has an automatic review; comment @claude to run another." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          lines=$((ADDITIONS + DELETIONS))
          if (( lines > MAX_AUTO_REVIEW_LINES )); then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "#$PR changes $lines lines, over the $MAX_AUTO_REVIEW_LINES-line limit, so it was skipped." >> "$GITHUB_STEP_SUMMARY"
            if ! grep -qF "$SIZE_SKIP_MARKER" <<< "$comments"; then
              printf '%s\nSkipped the automatic design review: this pull request changes %s lines, over the %s-line limit for automatic reviews. Comment `@claude` to request one anyway, and add what to focus on if you like.\n' \
                "$SIZE_SKIP_MARKER" "$lines" "$MAX_AUTO_REVIEW_LINES" > skip.md
              gh pr comment "$PR" --repo "$REPO" --body-file skip.md
            fi
            exit 0
          fi

          # Count today's review comments (local midnight) to enforce the daily cap.
          since=$(date -u -d "$(TZ="$CAP_TIMEZONE" date +%Y-%m-%dT00:00:00%:z)" +%Y-%m-%dT%H:%M:%SZ)
          today=$(gh api --paginate "repos/$REPO/issues/comments?since=$since&per_page=100" \
            --jq ".[] | select(.created_at >= \"$since\" and .user.login == \"github-actions[bot]\") | .body" |
            grep -cF "$REVIEW_MARKER" || true)
          if (( today >= DAILY_REVIEW_CAP )); then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "#$PR skipped: $today reviews already today, the daily cap is $DAILY_REVIEW_CAP." >> "$GITHUB_STEP_SUMMARY"
            if ! grep -qF "$CAP_SKIP_MARKER" <<< "$comments"; then
              printf '%s\nSkipped the automatic design review: the daily limit of %s automatic reviews is reached. Comment `@claude` to request one anyway.\n' \
                "$CAP_SKIP_MARKER" "$DAILY_REVIEW_CAP" > cap.md
              gh pr comment "$PR" --repo "$REPO" --body-file cap.md
            fi
            exit 0
          fi

          echo "review=true" >> "$GITHUB_OUTPUT"
          echo "Reviewing #$PR ($lines lines changed; review $((today + 1)) of $DAILY_REVIEW_CAP today)." >> "$GITHUB_STEP_SUMMARY"

  review:
    name: review
    needs: decide
    if: needs.decide.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: claude-design-review-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false

    steps:
      - name: Check out the reviewer from the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          sparse-checkout: .github/claude
          persist-credentials: false

      - name: Check out the pull request
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/pull/${{ needs.decide.outputs.pr }}/head
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Gather the pull request, its issues and its diff
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          REQUEST: ${{ github.event.comment.body }}
          REQUEST_PATH: ${{ github.event.comment.path }}
          REQUEST_LINE: ${{ github.event.comment.line || github.event.comment.original_line }}
          REQUEST_HUNK: ${{ github.event.comment.diff_hunk }}
        run: |
          mkdir -p .claude-review
          gh pr view "$PR" --repo "$REPO" \
            --json number,url,title,body,author,baseRefName,headRefName,isDraft,additions,deletions,changedFiles,closingIssuesReferences \
            > .claude-review/pr.json
          gh pr view "$PR" --repo "$REPO" --json files > .claude-review/files.json
          if ! gh pr diff "$PR" --repo "$REPO" > .claude-review/pr.diff 2> ../diff-error.txt; then
            # GitHub's API refuses very large diffs, so build it locally from the base branch instead.
            base=$(jq -r .baseRefName .claude-review/pr.json)
            if git fetch --quiet --no-tags --unshallow --filter=blob:none origin "+refs/heads/$base:refs/remotes/origin/$base" &&
               git diff "origin/$base...HEAD" > .claude-review/pr.diff; then
              echo "::notice::GitHub's API could not return the diff ($(head -c 200 ../diff-error.txt)), so it was built locally."
            else
              echo "::error::Neither GitHub's API nor git could produce this pull request's diff."
              cat ../diff-error.txt
              exit 1
            fi
          fi
          jq -r '.closingIssuesReferences[]? | "\(.number) \(.url)"' .claude-review/pr.json |
            while read -r number url; do
              gh issue view "$url" --json title,body,url --template '# {{.title}}{{"\n"}}{{.url}}{{"\n\n"}}{{.body}}{{"\n"}}' \
                > ".claude-review/issue-$number.md" || true
            done
          if [[ -n "$REQUEST" ]]; then
            {
              if [[ -n "$REQUEST_PATH" ]]; then
                printf 'Asked on %s, line %s, about this part of the diff:\n\n~~~~diff\n%s\n~~~~\n\n' \
                  "$REQUEST_PATH" "${REQUEST_LINE:-?}" "$REQUEST_HUNK"
              fi
              printf '%s\n' "$REQUEST"
            } > .claude-review/request.md
          fi

      - name: Install the Anthropic SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/claude-review-venv"
          "$RUNNER_TEMP/claude-review-venv/bin/pip" install --quiet --disable-pip-version-check 'anthropic==2.6.0'

      - name: Review the design
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
        run: |
          "$RUNNER_TEMP/claude-review-venv/bin/python" -I base/.github/claude/design_review.py \
            --root pr \
            --prompt base/.github/claude/design-review.md \
            --task "Review the design of pull request #$PR in $REPO. Its context is in .claude-review/." \
            --out review.md

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
        run: |
          {
            echo "$REVIEW_MARKER"
            cat review.md
            echo
            echo '<sub>Design review by Claude. Comment `@claude` to run it again, with what to focus on if you like.</sub>'
          } > review-comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file review-comment.md

name: Device Validation

on:
  workflow_call:
    inputs:
      release-acceptance:
        type: boolean
        default: false
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'app-logic/**'
      - 'macrobenchmark/**'
      - 'core-*/**'
      - 'baseline-profile/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/verify_release_acceptance_device.sh'
      - 'scripts/verify_device_apk.py'
      - 'scripts/verify_debug_device.sh'
      - 'scripts/device_validation_common.sh'
      - '.github/workflows/device-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'app-logic/**'
      - 'macrobenchmark/**'
      - 'core-*/**'
      - 'baseline-profile/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/verify_release_acceptance_device.sh'
      - 'scripts/verify_device_apk.py'
      - 'scripts/verify_debug_device.sh'
      - 'scripts/device_validation_common.sh'
      - '.github/workflows/device-validation.yml'
  schedule:
    - cron: '23 07 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connected-tests:
    name: Connected tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Latest and previous stable Android releases; keep aligned with androidMinSdk.
        # Android 17 packages use the literal 37.0 coordinate in the SDK catalog.
        api-level: ["36", "37.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
          script: scripts/verify_debug_device.sh all

      - name: Upload connected-test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: connected-tests-api-${{ matrix.api-level }}
          path: |
            build/reports/device-preflight/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/connected/
            core-data-android/build/outputs/androidTest-results/connected/
            core-data-android/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

  release-acceptance:
    name: R8 release acceptance (API ${{ matrix.api-level }})
    if: inputs.release-acceptance || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        # Android 17 packages use the literal 37.0 coordinate in the SDK catalog.
        api-level: ["36", "37.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build minified release acceptance
        run: ./gradlew :app:assembleReleaseAcceptance --stacktrace

      - name: Run minified release acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
          script: scripts/verify_release_acceptance_device.sh

      - name: Upload release-acceptance reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-acceptance-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/releaseAcceptance/
            app/build/outputs/mapping/releaseAcceptance/
          if-no-files-found: warn
          retention-days: 14

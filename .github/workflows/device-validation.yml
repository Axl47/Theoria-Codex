name: Device Validation

# Runs on every push to main (called by Main), inside a release whose commit has no recorded device
# result, weekly to catch drift in the Android images, and on request for a risky change:
# gh workflow run device-validation.yml --ref <branch>
# Only the Main and Release callers pass `record`, and only a run on main records the result.
on:
  workflow_call:
    inputs:
      record:
        description: Record the result for the checked-out commit when every test passes on main.
        type: boolean
        default: false
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
  schedule:
    - cron: '23 07 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# The caller's name keeps a Release fallback from queueing behind (or replacing) Main's run.
concurrency:
  group: device-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connected-tests:
    name: Connected tests (API ${{ matrix.api-level }}, part ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Latest and previous stable Android releases; keep aligned with androidMinSdk.
        # Android 17 packages use the literal 37.0 coordinate in the SDK catalog.
        api-level: ["36", "37.0"]
        # Each API level's tests are split across two runners, which roughly halves the slowest job.
        # The total of 2 is repeated in the job name and DEVICE_TEST_SHARD below.
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the emulator
        run: bash scripts/free_ci_disk.sh

      - name: Update Android command-line tools for minor API versions
        run: bash scripts/prepare_ci_android_sdk.sh

      - name: Build isolated test APKs before starting the emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core-data-android:assembleDebugAndroidTest --console=plain

      - name: Run connected device tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEVICE_TEST_SHARD: ${{ matrix.shard }}/2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Hosted runners have 4 vCPUs; the action's default gives the emulator only 2.
          cores: 4
          # Android 17's default data partition leaves too little room for the app/test APKs.
          disk-size: 6G
          ram-size: 4096M
          disable-animations: true
          # swiftshader_indirect kills the API 36 emulator once the Viewer draws its gradient scrims.
          emulator-options: >-
            -no-snapshot
            -no-window
            -gpu swangle_indirect
            -noaudio
            -no-boot-anim
          script: bash scripts/verify_ci_emulator.sh debug

      - name: Upload connected-test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: connected-tests-api-${{ matrix.api-level }}-part-${{ matrix.shard }}
          path: |
            build/reports/ci-emulator/
            build/reports/device-preflight/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/connected/
            core-data-android/build/outputs/androidTest-results/connected/
            core-data-android/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

  release-acceptance:
    name: R8 release acceptance (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        # Android 17 packages use the literal 37.0 coordinate in the SDK catalog.
        api-level: ["36", "37.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Initialize Android signing directory
        run: |
          android_user_home="$RUNNER_TEMP/theoria-android-user-home"
          mkdir -p "$android_user_home"
          echo "ANDROID_USER_HOME=$android_user_home" >> "$GITHUB_ENV"

      - name: Build minified release acceptance
        run: ./gradlew :app:assembleReleaseAcceptance --stacktrace

      - name: Free disk space for the emulator
        run: bash scripts/free_ci_disk.sh

      - name: Update Android command-line tools for minor API versions
        run: bash scripts/prepare_ci_android_sdk.sh

      - name: Run minified release acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Hosted runners have 4 vCPUs; the action's default gives the emulator only 2.
          cores: 4
          disk-size: 6G
          ram-size: 4096M
          disable-animations: true
          # swiftshader_indirect kills the API 36 emulator once the Viewer draws its gradient scrims.
          emulator-options: >-
            -no-snapshot
            -no-window
            -gpu swangle_indirect
            -noaudio
            -no-boot-anim
          script: bash scripts/verify_ci_emulator.sh acceptance

      - name: Upload release-acceptance reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-acceptance-api-${{ matrix.api-level }}
          path: |
            build/reports/ci-emulator/
            app/build/outputs/apk/releaseAcceptance/
            app/build/outputs/mapping/releaseAcceptance/
          if-no-files-found: warn
          retention-days: 14

  record:
    name: Record device result
    needs: [connected-tests, release-acceptance]
    if: inputs.record && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # The workflow's own commit, which is exactly what the jobs above tested.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      # Best effort inside a release, so a recording problem never blocks publishing.
      - name: Record the device result
        continue-on-error: ${{ github.event_name != 'push' }}
        run: python3 scripts/release_gate.py record device

name: Verify

# Runs scripts/check.sh unless that exact code already passed it, on a Mac or in an earlier run.
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lookup:
    name: Look for an existing result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}

    steps:
      - name: Find a recorded pass for this code
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq .tree.sha)"
          if [[ -n "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/verified/${tree}")" ]]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "This exact code already passed scripts/check.sh, so the full check was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: Full check
    needs: lookup
    if: ${{ needs.lookup.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Run the shared check
        run: bash scripts/check.sh

      # Best effort: Dependabot and fork runs get a read-only token and simply skip recording.
      - name: Record the pass
        continue-on-error: true
        run: git push --quiet origin "+HEAD:refs/verified/$(git rev-parse 'HEAD^{tree}')"

      # Machine-readable phase and Gradle task durations, tracked over time by an external dashboard.
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-timings
          path: build/reports/timings/ci-timings.json
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize timings
        if: always() && hashFiles('build/reports/timings/ci-timings.json') != ''
        run: |
          jq -r '
            "| Phase | Seconds |", "| --- | ---: |",
            (.phases[] | "| \(.name)\(if .ok then "" else " (failed)" end) | \(.seconds) |"),
            "", "| Slowest task | Seconds | Outcome |", "| --- | ---: | --- |",
            (.tasks | sort_by(-.seconds) | .[:10][] | "| `\(.path)` | \(.seconds) | \(.outcome) |")
          ' build/reports/timings/ci-timings.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*
            app/build/reports/detekt/
            app-logic/build/reports/detekt/
            core-*/build/reports/detekt/
            core-data-android/build/test-results/
            core-data-android/build/reports/tests/
            core-data-android/build/reports/lint-results-*
            build/reports/quality/
            build/reports/jscpd/
            build/reports/kover/
          if-no-files-found: warn
          retention-days: 14

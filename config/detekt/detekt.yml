config:
  validation: true
  warningsAsErrors: true

processors:
  active: true

console-reports:
  active: true

comments:
  active: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
  ComplexCondition:
    active: false
  ComplexInterface:
    active: false
  CyclomaticComplexMethod:
    active: false
  LabeledExpression:
    active: false
  LargeClass:
    active: true
    allowedLines: 600
  LongMethod:
    active: true
    allowedLines: 60
  LongParameterList:
    active: false
  MethodOverloading:
    active: false
  NamedArguments:
    active: false
  NestedBlockDepth:
    active: false
  NestedScopeFunctions:
    active: false
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false
  TooManyFunctions:
    active: false

coroutines:
  active: true
  CoroutineLaunchedInTestWithoutRunTest:
    active: false
  GlobalCoroutineUsage:
    active: false
  InjectDispatcher:
    active: false
  RedundantSuspendModifier:
    active: false
  SleepInsteadOfDelay:
    active: false
  SuspendFunInFinallySection:
    active: false
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: false
  SuspendFunWithFlowReturnType:
    active: false

empty-blocks:
  active: false

exceptions:
  active: true
  # Deliberate failure-isolation boundaries (provider, storage, decoder) that rethrow cancellation first;
  # SuspendFunSwallowedCancellation guards the real risk.
  TooGenericExceptionCaught:
    active: false

naming:
  active: false

performance:
  active: false

potential-bugs:
  active: true

style:
  active: false

theoria:
  active: true
  CancellationCatchRule:
    active: true
    excludes: ['**/CoroutineResults.kt']
  StoredJsonUsesDurableJsonRule:
    active: true
    excludes: ['**/DurableJson.kt', '**/core-sources/src/**', '**/extension-host/src/**', '**/app/src/releaseAcceptance/**']
  DefaultedCoroutineScopeRule:
    active: true
    includes: ['**/core-data/src/main/**']
